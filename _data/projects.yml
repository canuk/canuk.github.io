# Project listings for the home page.
#
# Sorting rules (handled in index.html):
#   1. Anything with `featured:` (a number) pins to the top, in ascending order.
#      Set featured: 1, 2, 3, ... for the order you want them to appear.
#   2. Everything else sorts by `date:` descending (newest first).
#
# To add a new project: copy any block below, set the date to today, and drop
# it anywhere in this file. Position in the file doesn't matter — sorting is
# by `featured` then `date`.

