<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load QRCode.js library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <!-- Load Phosphor Icons for elegant UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        /* Custom animation for the toast notification */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .toast-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 text-white rounded-full mb-4 backdrop-blur-sm">
                <i class="ph ph-qr-code text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-1">QR Code Generator</h1>
            <p class="text-indigo-100 text-sm">Enter text or a URL to generate a plain QR code.</p>
        </div>

        <!-- Input Section -->
        <div class="p-6">
            <label for="text-input" class="block text-sm font-medium text-slate-700 mb-2">Content</label>
            <textarea 
                id="text-input" 
                rows="3" 
                class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow outline-none resize-none mb-4"
                placeholder="https://example.com or any text..."
            ></textarea>

            <button 
                id="generate-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
            >
                <i class="ph ph-magic-wand text-lg"></i>
                Generate QR Code
            </button>
        </div>

        <!-- Output Section (Hidden initially) -->
        <div id="output-section" class="hidden p-6 pt-0 border-t border-slate-100 bg-slate-50 flex-col items-center">
            <p class="text-sm font-medium text-slate-500 mt-4 mb-4 uppercase tracking-wider">Your QR Code</p>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex justify-center items-center">
                <!-- Canvas where the QR code will be drawn -->
                <canvas id="qr-canvas" class="max-w-full rounded-md"></canvas>
            </div>

            <!-- Action Buttons -->
            <div class="w-full flex gap-3">
                <button 
                    id="copy-btn"
                    class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                >
                    <i class="ph ph-copy text-lg"></i>
                    Copy Image
                </button>
                <button 
                    id="download-btn"
                    class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                >
                    <i class="ph ph-download-simple text-lg"></i>
                    Download
                </button>
            </div>
            
            <p id="clipboard-warning" class="text-xs text-amber-600 mt-3 text-center hidden">
                <i class="ph ph-warning-circle inline align-middle"></i> 
                Clipboard copying might be blocked by your browser. Use download instead.
            </p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 hidden z-50">
        <i id="toast-icon" class="ph ph-check-circle text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Copied to clipboard!</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textInput = document.getElementById('text-input');
            const generateBtn = document.getElementById('generate-btn');
            const outputSection = document.getElementById('output-section');
            const qrCanvas = document.getElementById('qr-canvas');
            const copyBtn = document.getElementById('copy-btn');
            const downloadBtn = document.getElementById('download-btn');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            const clipboardWarning = document.getElementById('clipboard-warning');

            let toastTimeout;

            // Function to show toast notifications
            function showToast(message, isError = false) {
                toastMessage.textContent = message;
                
                if (isError) {
                    toastIcon.className = 'ph ph-x-circle text-red-400 text-lg';
                    toast.classList.replace('bg-slate-800', 'bg-red-900');
                } else {
                    toastIcon.className = 'ph ph-check-circle text-emerald-400 text-lg';
                    toast.classList.replace('bg-red-900', 'bg-slate-800');
                }

                toast.classList.remove('hidden');
                toast.classList.add('toast-enter');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.add('hidden');
                    toast.classList.remove('toast-enter');
                }, 3000);
            }

            // Generate QR Code
            generateBtn.addEventListener('click', () => {
                const text = textInput.value.trim();
                
                if (!text) {
                    showToast("Please enter some text or a URL", true);
                    textInput.focus();
                    return;
                }

                // Generate QR code on the canvas
                QRCode.toCanvas(qrCanvas, text, {
                    width: 256,
                    margin: 2,
                    color: {
                        dark: '#0f172a',  // Slate 900
                        light: '#ffffff'  // White background
                    }
                }, function (error) {
                    if (error) {
                        console.error(error);
                        showToast("Error generating QR code", true);
                    } else {
                        // Reveal the output section smoothly
                        outputSection.classList.remove('hidden');
                        outputSection.classList.add('flex');
                        
                        // Scroll to the bottom to show the result if needed
                        setTimeout(() => {
                            outputSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }, 100);
                    }
                });
            });

            // Copy Image to Clipboard
            copyBtn.addEventListener('click', () => {
                // Check if browser supports the required ClipboardItem API
                if (!navigator.clipboard || !window.ClipboardItem) {
                    clipboardWarning.classList.remove('hidden');
                    showToast("Clipboard API not supported here", true);
                    return;
                }

                qrCanvas.toBlob(async function(blob) {
                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        await navigator.clipboard.write([item]);
                        showToast("Image copied to clipboard!");
                        clipboardWarning.classList.add('hidden');
                    } catch (error) {
                        console.error("Clipboard copy failed:", error);
                        clipboardWarning.classList.remove('hidden');
                        showToast("Copy failed. Try downloading.", true);
                    }
                });
            });

            // Download Image Fallback
            downloadBtn.addEventListener('click', () => {
                try {
                    const dataUrl = qrCanvas.toDataURL("image/png");
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = 'qrcode.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    showToast("Download started!");
                } catch (error) {
                    console.error("Download failed:", error);
                    showToast("Failed to download image", true);
                }
            });

            // Allow generating by pressing Cmd+Enter or Ctrl+Enter
            textInput.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                    generateBtn.click();
                }
            });
        });
    </script>
</body>
</html>
